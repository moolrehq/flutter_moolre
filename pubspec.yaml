name: flutter_moolre
description: Moolre mobile-money checkout for Flutter. Native live checkout, in-app sandbox testing and payment status verified with Moolre.
version: 0.1.0
homepage: https://moolre.com
repository: https://github.com/moolrehq/flutter_moolre
topics:
  - payments
  - mobile-money
  - checkout
  - ghana

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.2.2
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/moolre_logo.png
  # Native in-app browser for Moolre's hosted payment page (sandbox).
  # Uses only the platform WebView; no third-party dependencies.
  plugin:
    platforms:
      android:
        package: com.moolre.flutter_moolre
        pluginClass: FlutterMoolrePlugin
      ios:
        pluginClass: FlutterMoolrePlugin
